<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../static/css/solicitar-orcamento.css">
    <script src="https://cdn.tailwindcss.com"></script>

    <title>Solicitar Orçamento</title>
</head>

<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <div class="bg-white p-8 rounded-xl shadow w-full max-w-xl">

        <h1 class="text-2xl font-bold mb-6 text-center">
            Solicitar Orçamento
        </h1>

        <form id="formOrcamento" class="space-y-4">

            <input id="nome" placeholder="Nome" class="w-full p-3 border rounded" required>

            <!-- EMAIL OPCIONAL -->
            <input id="email" type="email" placeholder="Email (opcional)" class="w-full p-3 border rounded">

            <input id="telefone" placeholder="Telefone" class="w-full p-3 border rounded" required>

            <select id="categoria" class="w-full p-3 border rounded" required>
                <option value="">Selecione</option>
                <option value="Tecnologia">Tecnologia</option>
                <option value="Hidráulica">Hidráulica</option>
                <option value="Elétrica">Elétrica</option>
                <option value="Reformas">Reformas</option>
            </select>

            <textarea id="descricao" placeholder="Descreva o serviço" class="w-full p-3 border rounded"></textarea>

            <button id="btnEnviar" type="submit" class="w-full bg-blue-600 text-white p-3 rounded">
                Enviar
            </button>

        </form>

    </div>

    <!-- EMAIL JS -->
    <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

    <script>

        // Inicializa EmailJS
        (function () {
            emailjs.init("uX9VTM1RJGpHB17ex");
        })();

        const form = document.getElementById("formOrcamento");
        const telefone = document.getElementById("telefone");
        const btn = document.getElementById("btnEnviar");

        // Máscara telefone
        telefone.addEventListener("input", () => {

            let v = telefone.value.replace(/\D/g, "");

            if (v.length > 11) {
                v = v.slice(0, 11);
            }

            v = v.replace(/(\d{2})(\d)/, "($1) $2");
            v = v.replace(/(\d{5})(\d)/, "$1-$2");

            telefone.value = v;
        });

        // Submit formulário
        form.addEventListener("submit", async function (e) {

            e.preventDefault();

            const categoria = document.getElementById("categoria").value;

            if (!categoria) {

                alert("Selecione uma categoria");

                return;
            }

            btn.innerText = "Enviando...";
            btn.disabled = true;

            const emailCliente = document.getElementById("email").value;

            const dadosBase = {
                nome: document.getElementById("nome").value,
                email: emailCliente || "Não informado",
                telefone: telefone.value,
                categoria: categoria,
                descricao: document.getElementById("descricao").value
            };

            try {

                // Busca prestadores no banco
                const res = await fetch(
                    `/api/prestadores_por_categoria?categoria=${encodeURIComponent(categoria)}`
                );

                const prestadores = await res.json();

                if (prestadores.length === 0) {

                    alert("Nenhum prestador disponível para esta categoria.");

                    btn.innerText = "Enviar";
                    btn.disabled = false;

                    return;
                }

                let promessas = [];

                // Envia email para cada prestador
                prestadores.forEach((p) => {

                    const envio = emailjs.send(
                        "service_b6ejlqp",
                        "template_ju6fbyc",
                        {
                            ...dadosBase,
                            email_prestador: p.email,
                            nome_prestador: p.nome + " " + p.sobrenome
                        }
                    );

                    promessas.push(envio);
                });

                // Envia confirmação para cliente
                if (emailCliente) {

                    const envioCliente = emailjs.send(
                        "service_b6ejlqp",
                        "template_a9a80tv",
                        dadosBase
                    );

                    promessas.push(envioCliente);
                }

                await Promise.all(promessas);

                window.location.href = "/sucesso-agendamento";

            } catch (error) {

                console.error(error);

                alert("Erro ao enviar. Tente novamente.");

                btn.innerText = "Enviar";
                btn.disabled = false;
            }
        });

    </script>

    <footer
        style="background:#0f172a;color:rgba(255,255,255,.55);text-align:center;padding:32px 20px 24px;font-size:13px;margin-top:48px;">
        <div style="max-width:900px;margin:0 auto;">
            <strong style="color:#fff;font-size:15px;">Agenda Fácil</strong>
            <p style="margin:6px 0 14px;">Conectando pessoas a profissionais de confiança.</p>
            <div
                style="border-top:1px solid rgba(255,255,255,.1);padding-top:14px;font-size:11px;color:rgba(255,255,255,.3);">
                © 2026 Agenda Fácil. Todos os direitos reservados.
            </div>
        </div>
    </footer>

</body>

</html>
