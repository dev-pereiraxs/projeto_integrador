<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel do Prestador</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../static/global.css">
  <link rel="stylesheet" href="../static/css/painel-prestador.css">
</head>

<body class="bg-[var(--bg)] text-[var(--text)]">
  <div class="painel-wrapper">

    <!-- Cabeçalho -->
    <div class="painel-header">
      <h1>Painel do Prestador</h1>
    </div>

    <!-- Cards de métricas -->
    <div class="metrics-grid">
      <div class="metric-card">
        <div id="pendentes" class="metric-card__value">0</div>
        <div class="metric-card__label">Pendentes</div>
      </div>

      <div class="metric-card">
        <div id="andamento" class="metric-card__value">0</div>
        <div class="metric-card__label">Em Andamento</div>
      </div>

      <div class="metric-card">
        <div id="concluidos" class="metric-card__value">0</div>
        <div class="metric-card__label">Concluídos</div>
      </div>
    </div>

    <!-- Barra de ações -->
    <div class="actions-bar">
      <button class="btn">Pedidos</button>

      <a href="{{ url_for('formulario') }}" class="btn-novo-servico">
        + Novo Serviço
      </a>
    </div>

    <!-- Lista de pedidos -->
    <div id="lista"></div>

  </div>

  <script src="../static/js/pn.js"></script>

  <footer class="site-footer">
    <div class="footer-inner">
      <strong class="footer-brand">Agenda Fácil</strong>
      <p class="footer-tagline">Conectando pessoas a profissionais de confiança.</p>
      <nav class="footer-links">
        <a href="/">Início</a>
        <a href="/servicos">Serviços</a>
        <a href="/prestador">Seja Prestador</a>
        <a href="/orcamentos">Orçamentos</a>
      </nav>
      <div class="footer-copy">
        © 2025 Agenda Fácil. Todos os direitos reservados.
      </div>
    </div>
  </footer>

</body>
</html>
