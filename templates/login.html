<!doctype html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Ícones -->
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="../static/global.css">
  <link rel="stylesheet" href="../static/logincss.css">

  <title>Login - Agenda Fácil</title>
  <link rel="icon" href="{{ url_for('static', filename='img/agenda-facil.png') }}" type="image/png" />

</head>

<body>
 
  <div class="formulario" style="padding-top:90px;">
    <h1>Acessar conta</h1>

    {% if erro %}
    <div
      style="background-color: #ffcccc; color: #cc0000; padding: 10px; border-radius: 8px; text-align: center; margin-bottom: 15px; font-weight: bold;">
      <i class="fa-solid fa-circle-exclamation"></i> {{ erro }}
    </div>
    {% endif %}

    <form action="{{ url_for('autenticar') }}" method="POST" id="form">

      <!-- USUÁRIO -->

      <div class="caixa-formulario">
        <input type="email" name="email" id="email" class="form-control" required placeholder="Email">
        <i class='bx bxs-user'></i>
      </div>

      <!-- SENHA -->
      <div class="caixa-formulario">
        <input type="password" name="senha" id="password" class="form-control" required placeholder="Senha">
        <i class="bx bxs-lock-alt"></i>
      </div>

      <!-- OPÇÕES -->
      <div class="caixa-lembrar-esqueci">

          <input type="checkbox" name="lembrar" id="lembrar">
        <label for="lembrar">Lembrar de mim</label>

        <!-- 🔧 CORRIGIDO (antes não era clicável) -->
        <a href="/esqueci_senha">Esqueci minha senha</a>
      </div>

      <!-- BOTÃO -->
      <button type="submit" class="btn-default">Entrar</button>


      <!-- DIVISOR -->
      <div style="display:flex;align-items:center;gap:10px;margin:6px 0 2px;">
        <hr style="flex:1;border:none;border-top:1px solid rgba(255,255,255,.15);">
        <span style="font-size:12px;color:#aaa;letter-spacing:.5px;">ou</span>
        <hr style="flex:1;border:none;border-top:1px solid rgba(255,255,255,.15);">
      </div>

      <!-- BOTÃO GOOGLE -->
      <a href="/login-google"
        style="display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:11px 16px;border:1px solid rgba(255,255,255,.2);border-radius:8px;background:rgba(255,255,255,.06);color:#eee;font-size:14px;font-weight:500;text-decoration:none;transition:background .2s;"
        onmouseover="this.style.background='rgba(255,255,255,.12)'"
        onmouseout="this.style.background='rgba(255,255,255,.06)'">
        <img src="https://developers.google.com/identity/images/g-logo.png" width="18" height="18" alt="Google"
          style="border-radius:2px;">
        Continuar com Google
      </a>

      <!-- REGISTRO -->
      <div class="link-registro">
        <p>
          Não tem conta?
          <a href=" {{ url_for('cadastro')}} ">Registrar</a>
        </p>
      </div>

    </form>
  </div>
</body>

</html>
