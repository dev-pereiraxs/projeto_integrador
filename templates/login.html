<!doctype html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Ícones -->
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="../static/global.css">
  <link rel="stylesheet" href="../static/logincss.css">

  <title>Login - Agenda Fácil</title>
</head>

<body>
  <div class="formulario">
    <h1>Acessar conta</h1>

    {% if erro %}
    <div
      style="background-color: #ffcccc; color: #cc0000; padding: 10px; border-radius: 8px; text-align: center; margin-bottom: 15px; font-weight: bold;">
      <i class="fa-solid fa-circle-exclamation"></i> {{ erro }}
    </div>
    {% endif %}
    <form action="{{ url_for('autenticar') }}" method="POST" id="form">

      <!-- USUÁRIO -->
      <div class="caixa-formulario">
        <input type="email" name="email" id="email" class="form-control" required placeholder="Email">
        <i class='bx bxs-user'></i>
      </div>

      <!-- SENHA -->
      <div class="caixa-formulario">
        <input type="password" name="senha" id="password" class="form-control" required placeholder="Senha">
        <i class="bx bxs-lock-alt"></i>
      </div>

      <!-- OPÇÕES -->
      <div class="caixa-lembrar-esqueci">
        <label>
          <input type="checkbox"> Lembrar
        </label>

        <!-- 🔧 CORRIGIDO (antes não era clicável) -->
        <a href="#">Esqueci minha senha</a>
      </div>

      <!-- BOTÃO -->
      <button type="submit" class="btn-default">Entrar</button>


      <!-- DIVISOR -->
      <div style="display:flex;align-items:center;gap:10px;margin:6px 0 2px;">
        <hr style="flex:1;border:none;border-top:1px solid rgba(255,255,255,.15);">
        <span style="font-size:12px;color:#aaa;letter-spacing:.5px;">ou</span>
        <hr style="flex:1;border:none;border-top:1px solid rgba(255,255,255,.15);">
      </div>

      <!-- BOTÃO GOOGLE -->
      <a href="/login-google"
        style="display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:11px 16px;border:1px solid rgba(255,255,255,.2);border-radius:8px;background:rgba(255,255,255,.06);color:#eee;font-size:14px;font-weight:500;text-decoration:none;transition:background .2s;"
        onmouseover="this.style.background='rgba(255,255,255,.12)'"
        onmouseout="this.style.background='rgba(255,255,255,.06)'">
        <img src="https://developers.google.com/identity/images/g-logo.png" width="18" height="18" alt="Google"
          style="border-radius:2px;">
        Continuar com Google
      </a>

      <!-- REGISTRO -->
      <div class="link-registro">
        <p>
          Não tem conta?
          <a href=" {{ url_for('cadastro')}} ">Registrar</a>
        </p>
      </div>

    </form>
  </div>

<footer style="background:#0f172a;color:rgba(255,255,255,.55);text-align:center;padding:32px 20px 24px;font-size:13px;margin-top:48px;">
  <div style="max-width:900px;margin:0 auto;">
    <strong style="color:#fff;font-size:15px;">Agenda Fácil</strong>
    <p style="margin:6px 0 14px;">Conectando pessoas a profissionais de confiança.</p>
    <div style="display:flex;justify-content:center;gap:24px;flex-wrap:wrap;font-size:12px;margin-bottom:14px;">
      <a href="/"       style="color:rgba(255,255,255,.45);text-decoration:none;">Início</a>
      <a href="/servicos" style="color:rgba(255,255,255,.45);text-decoration:none;">Serviços</a>
      <a href="/prestador" style="color:rgba(255,255,255,.45);text-decoration:none;">Seja Prestador</a>
      <a href="/orcamentos" style="color:rgba(255,255,255,.45);text-decoration:none;">Orçamentos</a>
    </div>
    <div style="border-top:1px solid rgba(255,255,255,.1);padding-top:14px;font-size:11px;color:rgba(255,255,255,.3);">
      © 2025 Agenda Fácil. Todos os direitos reservados.
    </div>
  </div>
</footer>
</body>

</html>
