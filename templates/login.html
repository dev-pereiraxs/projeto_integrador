<!doctype html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../static/global.css">
  <link rel="stylesheet" href="../static/logincss.css">
  <title>Login - Agenda Fácil</title>
  <link rel="icon" href="{{ url_for('static', filename='img/agenda-facil.png') }}" type="image/png" />
</head>

<body class="pg-dark">

  {% include 'partials/header.html' %}

  <div class="login-shell">
    <div class="formulario">

      <img src="{{ url_for('static', filename='img/agenda-facil.png') }}" alt="Agenda Fácil"
           style="display:block;margin:0 auto 20px auto;width:76px;height:76px;border-radius:18px;object-fit:cover;box-shadow:0 8px 24px rgba(37,99,235,0.25);border:1px solid rgba(255,255,255,0.1);">

      <h1 style="text-align:center;margin-bottom:24px;">Acessar conta</h1>

      {% if erro %}
      <div style="background-color:#ffcccc;color:#cc0000;padding:10px;border-radius:8px;text-align:center;margin-bottom:15px;font-weight:bold;">
        {{ erro }}
      </div>
      {% endif %}

      <form action="{{ url_for('autenticar') }}" method="POST" id="form">

        <div class="caixa-formulario">
          <input type="email" name="email" id="email" required placeholder="Email">
          <i class='bx bxs-user'></i>
        </div>

        <div class="caixa-formulario">
          <input type="password" name="senha" id="password" required placeholder="Senha">
          <i class="bx bxs-lock-alt"></i>
        </div>

        <div class="caixa-lembrar-esqueci">
          <label for="lembrar">
            <input type="checkbox" name="lembrar" id="lembrar">
            Lembrar de mim
          </label>
          <a href="/esqueci_senha">Esqueci minha senha</a>
        </div>

        <button type="submit" class="btn-default">Entrar</button>

        <div style="display:flex;align-items:center;gap:10px;margin:6px 0 2px;">
          <hr style="flex:1;border:none;border-top:1px solid rgba(255,255,255,.15);">
          <span style="font-size:12px;color:#aaa;letter-spacing:.5px;">ou</span>
          <hr style="flex:1;border:none;border-top:1px solid rgba(255,255,255,.15);">
        </div>

        <a href="/login-google"
          style="display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:11px 16px;border:1px solid rgba(255,255,255,.2);border-radius:8px;background:rgba(255,255,255,.06);color:#eee;font-size:14px;font-weight:500;text-decoration:none;transition:background .2s;"
          onmouseover="this.style.background='rgba(255,255,255,.12)'"
          onmouseout="this.style.background='rgba(255,255,255,.06)'">
          <img src="https://developers.google.com/identity/images/g-logo.png" width="18" height="18" alt="Google" style="border-radius:2px;">
          Continuar com Google
        </a>

        <div class="link-registro">
          <p>Não tem conta? <a href="{{ url_for('cadastro') }}">Registrar</a></p>
        </div>

        <input type="hidden" name="next" value="{{ session.get('next_url', '') }}">

      </form>
    </div>
  </div>

</body>
</html>
