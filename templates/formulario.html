<!doctype html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Novo Serviço</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../static/global.css">
  <link rel="stylesheet" href="../static/painel.css">
</head>

<body class="bg-[var(--bg)]">
  <div class="form-wrapper">
    <h1 class="form-title">Cadastrar Novo Serviço</h1>

    <form id="form" class="form-card">

      <div class="form-group">
        <label class="form-label">Categoria</label>
        <select id="categoria" class="input">
          <option>Selecione</option>
          <option value="mecanica">Mecânica</option>
          <option value="eletrica">Elétrica</option>
          <option value="tecnologia">Tecnologia</option>
          <option value="reformas">Reformas</option>
          <option value="hidraulica">Hidráulica</option>
          <option value="limpeza">Limpeza</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">Serviço</label>
        <select id="subcategoria" class="input">
          <option>Selecione uma categoria primeiro</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">Descrição</label>
        <textarea id="descricao" class="input textarea"></textarea>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Preço Base (R$)</label>
          <input id="preco" type="number" class="input" />
        </div>

        <div class="form-group">
          <label class="form-label">Duração (Horas)</label>
          <input id="duracao" type="number" class="input" />
        </div>
      </div>

      <button type="submit" class="btn-primary">+ Cadastrar Serviço</button>
    </form>
  </div>

  <script src="../static/js/forms.js"></script>

  <footer
    style="background:#0f172a;color:rgba(255,255,255,.55);text-align:center;padding:32px 20px 24px;font-size:13px;margin-top:48px;">
    <div style="max-width:900px;margin:0 auto;">
      <strong style="color:#fff;font-size:15px;">Agenda Fácil</strong>
      <p style="margin:6px 0 14px;">Conectando pessoas a profissionais de confiança.</p>
      <div style="display:flex;justify-content:center;gap:24px;flex-wrap:wrap;font-size:12px;margin-bottom:14px;">
        <a href="/" style="color:rgba(255,255,255,.45);text-decoration:none;">Início</a>
        <a href="/servicos" style="color:rgba(255,255,255,.45);text-decoration:none;">Serviços</a>
        <a href="/prestador" style="color:rgba(255,255,255,.45);text-decoration:none;">Seja Prestador</a>
        <a href="/orcamentos" style="color:rgba(255,255,255,.45);text-decoration:none;">Orçamentos</a>
      </div>
      <div
        style="border-top:1px solid rgba(255,255,255,.1);padding-top:14px;font-size:11px;color:rgba(255,255,255,.3);">
        © 2025 Agenda Fácil. Todos os direitos reservados.
      </div>
    </div>
  </footer>
</body>

</html>
