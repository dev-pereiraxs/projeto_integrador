<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="{{ url_for('static', filename='img/agenda-facil.png') }}" type="image/png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recuperar Senha – Serviço Fácil</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --blue-gl: linear-gradient(135deg, #2563eb, #1d4ed8);
      --text: #1a2340;
      --muted: #64748b;
      --border: #e2e8f0;
      --white: #ffffff;
      --radius: 16px;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: #f1f5f9;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
    }

    .box {
      width: 100%;
      max-width: 420px;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: var(--radius);
      padding: 40px 32px;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.24);
      animation: cardIn 0.5s cubic-bezier(.22, 1, .36, 1) both;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(20px) scale(.97); }
      to { opacity: 1; transform: none; }
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-decoration: none;
      margin-bottom: 28px;
    }

    .brand img {
      width: 32px;
      height: 32px;
      object-fit: contain;
    }

    .brand-text {
      font-family: 'Sora', sans-serif;
      font-size: 20px;
      font-weight: 700;
      color: #0f172a;
    }

    .brand-text span {
      color: #2563eb;
    }

    .title {
      font-family: 'Sora', sans-serif;
      font-size: 22px;
      font-weight: 700;
      color: #111827;
      margin-bottom: 8px;
      letter-spacing: -.3px;
    }

    .subtitle {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .5px;
      color: #374151;
      margin-bottom: 8px;
    }

    .input-wrap {
      position: relative;
    }

    .input-wrap span {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 16px;
      color: var(--muted);
    }

    .input {
      width: 100%;
      padding: 12px 14px 12px 40px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      color: var(--text);
      background: #fafafa;
      outline: none;
      transition: border-color .2s, box-shadow .2s, background .2s;
    }

    .input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
      background: #fff;
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: var(--blue-gl);
      color: white;
      font-family: 'Sora', sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.3);
      transition: opacity .2s, transform .15s;
    }

    .btn-submit:hover {
      opacity: .92;
      transform: translateY(-1px);
    }

    .btn-submit:active {
      transform: translateY(0);
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 24px;
      font-size: 13.5px;
      font-weight: 500;
      color: #2563eb;
      text-decoration: none;
      transition: color .2s;
    }

    .back-link:hover {
      color: #1d4ed8;
      text-decoration: underline;
    }

    /* Feedback de Mensagem do Flask */
    .alert-success {
      background: #ecfdf5;
      border: 1px solid #a7f3d0;
      color: #065f46;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 13.5px;
      line-height: 1.5;
      margin-bottom: 20px;
    }
  </style>
</head>

<body>

  <div class="wrap">
    <div class="box">
      <a class="brand" href="/">
        <img src="{{ url_for('static', filename='img/agenda-facil.png') }}" alt="Logo">
        <span class="brand-text">Agenda <span>Fácil</span></span>
      </a>

      <h2 class="title">Esqueceu sua senha?</h2>
      <p class="subtitle">Insira seu e-mail cadastrado abaixo e enviaremos um link seguro para criar uma nova senha.</p>

      {% if sucesso %}
      <div class="alert-success">
        {{ sucesso }}
      </div>
      {% endif %}

      <form action="/esqueci_senha" method="POST">
        <div class="form-group">
          <label class="label" for="email">Endereço de E-mail</label>
          <div class="input-wrap">
            <span>✉️</span>
            <input type="email" id="email" name="email" class="input" placeholder="exemplo@email.com" required autocomplete="email">
          </div>
        </div>

        <button type="submit" class="btn-submit">✨ Solicitar Nova Senha</button>
      </form>

      <a href="/login" class="back-link">Voltar para o Login</a>
    </div>
  </div>

</body>

</html>
